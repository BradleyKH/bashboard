[package]
name = "bashboard"
version = "0.4.4"
description = "A multipurpose terminal built for Claude Code"
authors = ["Bradley Harris"]
license = "MIT"
edition = "2024"
default-run = "bashboard"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Web Inspector in a release build, for the macOS preview workflow's testers (frame time, WebGL
# context limit). Release builds leave it off.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9.0"
arboard = { version = "3.7.0", default-features = false }
notify = "8"
json_comments = "0.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network"] }
tiny_http = "0.12"
getrandom = "0.3"
tauri-plugin-opener = "2.7.2"
jsonc-parser = { version = "0.34.0", features = ["cst"] }
tauri-plugin-dialog = "2"
ignore = "0.4.33"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# The version ureq uses: its error variants, and a bare ClientHello to tell whether a port speaks TLS.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, not abort: a panic on one background thread must not take down the process and with
# it every pty (docs/design/app.md section 3.22).
panic = "unwind"
strip = true

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite", "Win32_Security_Credentials", "Win32_System_Console"] }
tauri-winrt-notification = "0.8.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.0"
