[package]
name = "bashboard"
version = "0.4.11"
description = "A multipurpose terminal built for Claude Code"
authors = ["Bradley Harris"]
license = "MIT"
edition = "2024"
default-run = "bashboard"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Web Inspector in a release build, for the macOS preview workflow's testers (frame time, WebGL
# context limit). Release builds leave it off.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9.0"
arboard = { version = "3.7.0", default-features = false }
notify = "8"
json_comments = "0.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network"] }
tiny_http = "0.12"
getrandom = "0.3"
tauri-plugin-opener = "2.7.2"
jsonc-parser = { version = "0.34.0", features = ["cst"] }
tauri-plugin-dialog = "2"
ignore = "0.4.33"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# The version ureq uses: its error variants, and a bare ClientHello to tell whether a port speaks TLS.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
trash = "5.3.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, not abort: a panic on one background thread must not take down the process and with
# it every pty (docs/design/app.md section 3.22).
panic = "unwind"
strip = true

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = ["ApplicationModel", "Foundation", "Graphics_Imaging", "Media", "Media_Control", "Storage_Streams", "Win32_Graphics_DirectWrite", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Security_Credentials", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_Variant"] }
tauri-winrt-notification = "0.8.1"
clipboard-win = "5.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.0"

# Only for the web-process-terminated signal, which Tauri does not forward on Linux; the version
# and features follow what wry already builds.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_20"] }
# Forge tokens (credential_store.rs). The async-io runtime is the one zbus already builds here,
# and its blocking API needs no runtime, which `bb` does not have.
secret-service = { version = "5.2", features = ["rt-async-io-crypto-rust"] }
# Desktop notifications (toast_linux.rs). The default features use the pure-Rust zbus backend,
# so notify-rust links no libdbus itself. 4.18 is the last release on zbus 5, the major
# secret-service and tauri already build; 4.19 would add a second zbus major.
notify-rust = "~4.18"

# getsid, for attributing orphaned jobs to their pane (pty.rs), and statfs on macOS.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSDictionary", "NSError", "NSObject", "NSString", "NSUUID"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
security-framework = "3"
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFontCollection", "CTFontDescriptor", "CTFontTraits"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFString", "CFDictionary", "CFNumber"] }
