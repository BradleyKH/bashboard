name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# The windows job builds the installer into a draft release with latest.json; the linux job builds
# and signs the .deb, .rpm, AppImage, and Arch package beside it; publish attaches them, adds each
# to latest.json, and only then publishes, so a release missing either build never becomes the
# one the updater reads.
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check tag matches package.json version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      # Authenticode signing turns on once the Azure Artifact Signing secrets exist; without them the
      # release ships unsigned. signCommand is built here rather than kept in tauri.conf.json because
      # a local `pnpm tauri build` would run it too, with no Azure credentials.
      - name: Configure Authenticode signing
        id: sign
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "::warning::AZURE_CLIENT_ID is not set, so the installer will not be Authenticode signed"
            echo 'config={"bundle":{"createUpdaterArtifacts":true}}' >> "$GITHUB_OUTPUT"
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for v in AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE; do
            if [ -z "${!v}" ]; then
              echo "::error::repository variable $v is not set"
              exit 1
            fi
          done
          cmd="artifact-signing-cli -e $AZURE_SIGNING_ENDPOINT -a $AZURE_SIGNING_ACCOUNT -c $AZURE_SIGNING_PROFILE -d Bashboard %1"
          echo "config={\"bundle\":{\"createUpdaterArtifacts\":true,\"windows\":{\"signCommand\":\"$cmd\"}}}" >> "$GITHUB_OUTPUT"
          echo 'enabled=true' >> "$GITHUB_OUTPUT"

      # Release notes are the annotated tag's message, if any. checkout leaves the tag pointing
      # straight at the commit, so the tag object has to be fetched before its message can be
      # read. A lightweight tag has no message (its %(contents) would be the commit's), so it
      # gets only the standard text.
      - name: Read release notes from tag
        id: notes
        shell: bash
        run: |
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=""
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag ]; then
            notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          fi
          if [ "${{ steps.sign.outputs.enabled }}" = true ]; then
            standard='Beta release. Until the signed installer builds SmartScreen reputation, Windows may
          still warn on first run: choose "More info", then "Run anyway".'
          else
            standard='Beta release. The installer is unsigned, so Windows SmartScreen may warn on first run:
          choose "More info", then "Run anyway".'
          fi
          standard="$standard

          Linux support is early. The .deb (Ubuntu 22.04 or newer, Debian 12 or newer) is tested on KDE
          Plasma under X11 and Wayland; the Arch package, .rpm (Fedora), and AppImage (any distro) are
          new, and GNOME is partly tested. Install the .deb with
          \`sudo apt install ./bashboard_${GITHUB_REF_NAME#v}_amd64.deb\`, the Arch package with
          \`sudo pacman -U bashboard-${GITHUB_REF_NAME#v}-1-x86_64.pkg.tar.zst\`, or the .rpm with
          \`sudo dnf install ./bashboard-${GITHUB_REF_NAME#v}-1.x86_64.rpm\`. Each updates itself from
          then on."
          delim="NOTES_$(date +%s%N)"
          {
            echo "body<<$delim"
            if [ -n "$notes" ]; then
              printf '%s\n\n' "$notes"
            fi
            printf '%s\n' "$standard"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Front end tests
        run: pnpm test

      # The pty tests spawn Git Bash, which the runner image has installed.
      - name: Rust tests
        shell: bash
        working-directory: src-tauri
        run: cargo test

      - name: Install artifact-signing-cli
        if: steps.sign.outputs.enabled == 'true'
        run: cargo install artifact-signing-cli --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Bashboard v__VERSION__ (beta)'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --config '${{ steps.sign.outputs.config }}'

      # tauri-action owns the build, so the check runs on its output while the release is still a
      # draft. bb.exe must sit beside bashboard.exe once installed, so the installer script has
      # to list it as well as the build having produced it.
      - name: Assert installer ships bb.exe
        shell: bash
        run: |
          release=src-tauri/target/release
          if [ ! -f "$release/bb.exe" ]; then
            echo "::error::$release/bb.exe was not built"
            exit 1
          fi
          nsi=$(find "$release/nsis" -name '*.nsi' | head -n 1)
          if [ -z "$nsi" ]; then
            echo "::error::no NSIS script found under $release/nsis"
            exit 1
          fi
          if ! grep -q 'bb\.exe' "$nsi"; then
            echo "::error::$nsi does not mention bb.exe"
            exit 1
          fi
          echo "bb.exe is built and listed in $nsi"

      - name: Assert binaries are Authenticode signed
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $release = 'src-tauri/target/release'
          $files = @("$release/bashboard.exe", "$release/bb.exe") + (Get-ChildItem "$release/bundle/nsis/*-setup.exe").FullName
          $failed = $false
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$($sig.Status)  $f  $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::$f is not validly signed ($($sig.Status))"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  # Ubuntu 22.04 sets the glibc floor, as in CI.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf file rpm

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The windows job runs the platform-independent checks; these cover the Linux-only Rust.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build packages
        run: pnpm tauri build --bundles deb,rpm,appimage

      - name: Move bb off the system PATH
        run: bash scripts/linux/relayout-packages.sh

      # Repackages the relaid-out .rpm in an archlinux:base-devel container, which also installs
      # it with pacman and lints it with namcap.
      - name: Build the Arch package
        run: bash scripts/linux/build-arch-package.sh

      - name: Assert the packages ship bb
        run: bash scripts/linux/assert-bundle.sh --arch

      # The relayout rebuilds the .deb and .rpm, and the Arch package is made after it, so
      # signatures the bundler made would no longer match; the updater signatures are made here,
      # over the final files.
      - name: Sign the packages for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bundle=src-tauri/target/release/bundle
          for pattern in 'deb/*.deb' 'rpm/*.rpm' 'appimage/*.AppImage' 'arch/*.pkg.tar.zst'; do
            f=$(find "$bundle/${pattern%%/*}" -maxdepth 1 -name "${pattern#*/}" | head -n 1)
            if [ -z "$f" ]; then
              echo "::error::no $pattern under $bundle"
              exit 1
            fi
            pnpm tauri signer sign --app-version "${GITHUB_REF_NAME#v}" "$f"
            test -s "$f.sig"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: bashboard-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb*
            src-tauri/target/release/bundle/rpm/*.rpm*
            src-tauri/target/release/bundle/appimage/*.AppImage*
            src-tauri/target/release/bundle/arch/*.pkg.tar.zst*
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: bashboard-linux
          path: linux

      # One entry per package type, keyed as the updater looks it up: the plugin reads deb, rpm,
      # or appimage from the type the bundler stamped into the binary, and an Arch package install
      # asks for linux-x86_64-arch itself (pacman_update.rs), since it carries the .rpm's binary.
      # There is no bare linux-x86_64 entry, which every type would fall back to and could not
      # install. upload-artifact keeps the paths below the common bundle/ folder, hence the search
      # by name.
      - name: Attach the Linux packages and add them to latest.json
        run: |
          gh release download "$GITHUB_REF_NAME" -p latest.json -D manifest
          cp manifest/latest.json latest.json
          for entry in 'deb:*.deb' 'rpm:*.rpm' 'appimage:*.AppImage' 'arch:*.pkg.tar.zst'; do
            key="linux-x86_64-${entry%%:*}"
            f=$(find linux -name "${entry#*:}" | head -n 1)
            if [ -z "$f" ] || [ ! -s "$f.sig" ]; then
              echo "::error::no ${entry#*:} with its .sig in the bashboard-linux artifact"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber
            url="https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME/$(basename "$f")"
            jq --arg key "$key" --arg url "$url" --rawfile sig "$f.sig" \
              '.platforms[$key] = {signature: ($sig | rtrimstr("\n")), url: $url}' \
              latest.json > latest.json.tmp
            mv latest.json.tmp latest.json
          done
          jq -e '([.platforms["linux-x86_64-deb", "linux-x86_64-rpm", "linux-x86_64-appimage", "linux-x86_64-arch"].url] | all)
            and (.platforms | keys | any(startswith("windows-")))' latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber

      # Publishing last keeps a broken build off releases/latest, which the updater reads.
      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
